<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>

        p {
            font-family: Arial;
        }
        .title {
            font-size: 30px;
        }

        .dest , .pickup{
            width: 250px;
            display: block;
            border: none;
            background-color: rgba(128, 128, 128, 0.225);
            margin-bottom: 6px;
            padding: 8px;
            font-size: 12px;
        }

        .request-button {
            margin-top: 14px;
            border: none;
            background-color: black;
            color: white;
            padding: 10px;
        }

        .schedule-button {
            border: none;
            padding: 10px;
        }

    </style>

    <p class = "title">Request a ride now</p>
    <input class = "pickup" type="text" placeholder="Enter Pickup location">
    <input class = "dest" type="text" placeholder="Enter Destination">
    <button class = "request-button">Request Now</button>
    <button class = "schedule-button">Schedule For later</button>
</body>
</html>
