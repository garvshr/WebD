<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .subscribe_button {
            background-color: rgb(200, 0, 0);
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
            transition: 0.15s;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            vertical-align: top;
        }
        .subscribe_button:hover {
            opacity: 0.8;
        }
        .subscribe_button:active {
            opacity: 0.5;
        }

        .join_button {
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 16px;
            padding-right: 16px;
            background-color: white;
            border-color: rgb(6, 95, 212);
            border-style: solid;
            border-width: 1px;
            color: rgb(6, 95, 212);
            border-radius: 2px;
            cursor: pointer;
            transition: 0.15s;
            vertical-align: top;


        }
        .join_button:hover {
            color: white;
            background-color: rgb(6, 95, 212);
        }
        .join_button:active {
            opacity: 0.7;
        }

        .tweet_button {
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            color: white;
            background-color: rgb(29, 155, 240);
            border-radius: 25px;
            border-style: solid;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-left: 8px;
            transition: 0.15s;
            vertical-align: top;

            
        }
        .tweet_button:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
        }
    </style>

    <button class = "subscribe_button">SUBSCRIBE</button>
    <button class = "join_button">JOIN</button>
    <button class = "tweet_button">Tweet</button>
</body>

</html>
